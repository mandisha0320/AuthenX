version: "3.9"

# ─────────────────────────────────────────────────────────────
#  AuthenX — docker-compose.yml
#  Start everything: docker compose up
# ─────────────────────────────────────────────────────────────

services:

  authenx:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/authenx
    volumes:
      - ./checkpoints:/app/checkpoints  # mount fine-tuned model weights
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:
